# dsh-enhance-prompt bundle patch
# 宿主端（exports "."）注册 POST /enhance-prompt 路由；
# 浏览器端（exports "./client"）在输入框 dock 挂「增强」按钮。
#
# provider / model 留空表示跟随当前会话的模型选择；只有在解析不出时
# 才会用到这里的值。需要固定模型时再填，例如：
#   provider: deepseek
#   model: deepseek-chat
- insert:
    - id: enhance-prompt
      name: 'dsh-enhance-prompt'
      config:
        provider: ''
        model: ''
        maxTokens: 8192
        timeoutMs: 60000
        maxInputChars: 5000
